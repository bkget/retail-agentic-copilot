services:
  retail_copilot_db:
    image: postgres:17-alpine
    container_name: retail_copilot_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_AGENT_PASSWORD_FILE: /run/secrets/agent_password
      POSTGRES_REFRESHER_PASSWORD_FILE: /run/secrets/refresher_password
    secrets:
      - postgres_superuser_password
      - agent_password
      - refresher_password
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432" # 5433 to avoid clashing with local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s
    restart: unless-stopped

  retail_copilot_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        EXTRAS: ${BACKEND_EXTRAS:-redis} # add ",gemini" only if LLM_PROVIDER=gemini
    container_name: retail_copilot_backend
    environment:
      POSTGRES_HOST: retail_copilot_db
      POSTGRES_PORT: ${POSTGRES_INTERNAL_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_AGENT_PASSWORD_FILE: /run/secrets/agent_password
      POSTGRES_REFRESHER_PASSWORD_FILE: /run/secrets/refresher_password
      POSTGRES_AGENT_PASSWORD: ${POSTGRES_AGENT_PASSWORD:-}
      POSTGRES_REFRESHER_PASSWORD: ${POSTGRES_REFRESHER_PASSWORD:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-'["http://localhost:3000"]'}
      # Conversation memory: "memory" (single replica) or "redis" (run with --profile redis)
      SESSION_BACKEND: ${SESSION_BACKEND:-memory}
      REDIS_URL: ${REDIS_URL:-redis://retail_copilot_redis:6379/0}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
      # Optional free LLM fallback for unusual phrasings (never generates SQL or numbers).
      # none | openai_compatible  - see README "Running without a paid LLM key".
      NLU_FALLBACK: ${NLU_FALLBACK:-none}
      NLU_BASE_URL: ${NLU_BASE_URL:-http://host.docker.internal:11434/v1}
      NLU_MODEL: ${NLU_MODEL:-qwen2.5:3b}
      NLU_API_KEY: ${NLU_API_KEY:-}
      NARRATIVE_STREAM_DELAY_MS: ${NARRATIVE_STREAM_DELAY_MS:-18}
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets the container reach Ollama on the host (Linux)
    secrets:
      - agent_password
      - refresher_password
      - gemini_api_key
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000" # Host reachable port for browser SSE streams
    depends_on:
      retail_copilot_db:
        condition: service_healthy
    restart: unless-stopped

  retail_copilot_redis:
    image: redis:7-alpine
    container_name: retail_copilot_redis
    profiles: ["redis"]
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  retail_copilot_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-} # empty = same-origin via the Next.js /api proxy
        BACKEND_INTERNAL_URL: http://retail_copilot_backend:8000
    container_name: retail_copilot_frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      retail_copilot_backend:
        condition: service_healthy
    restart: unless-stopped

secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password.txt
  agent_password:
    file: ./secrets/agent_password.txt
  refresher_password:
    file: ./secrets/refresher_password.txt
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt

volumes:
  pgdata:
